# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: my-aurora-custom
description: 个人定制纯净工作站 (VSCode RPM / 按需Libvirt / Rime / Waydroid / Flatpak游戏环境)
base-image: ghcr.io/ublue-os/aurora-nvidia-open
image-version: latest

modules:
  - type: dnf
    repos:
      files:
        - vscode.repo
        - kopia.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
        - https://kopia.io/signing-key
    install:
      packages:
        # 原生开发工具
        - code
        - kopia
        - kopia-ui
        # KVM / QEMU / Libvirt 虚拟化套件
        - qemu-kvm
        - libvirt
        - libvirt-daemon-kvm
        - virt-manager
        - virt-install
        - edk2-ovmf
        # 中文输入法组件 (自动拉取 Fedora 下所有 Rime 基础依赖)
        - fcitx5-rime
        - librime-lua # 提供 Lua 脚本引擎支持
        - librime-octagram # 提供 Octagram 语法/语言模型支持，驱动大模型与语言模型预测。
        # Waydroid 容器与轻量合成器
        - waydroid
        - cage
        - wlr-randr
        # mpv播放器
        - mpv

  # 3. 系统服务状态调优
  - type: systemd
    system:
      enabled:
        - libvirtd.socket            # 虚拟化按需 Socket 监听，启动虚拟机时自动拉起
      disabled:
        - libvirtd.service           # 禁用虚拟化全量服务开机常驻
        - waydroid-container.service # 禁用 Waydroid 容器开机常驻，按需启动

  # 4. 预装沙箱化 Flatpak 应用
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.valvesoftware.Steam     # Steam（沙箱内自带 32 位运行库）
          - com.usebottles.bottles      # Bottles（管理独立老游戏与修改器容器）
          - com.github.tchx84.Flatseal  # Flatpak 权限管理器

  # 5. 镜像安全签名
  - type: signing
