# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: my-aurora-custom
description: 个人定制纯净工作站 (VSCode RPM / 按需Libvirt / Rime / Waydroid / 外部存储工具)
base-image: ghcr.io/ublue-os/aurora-nvidia-open
image-version: latest

modules:
  # 1. 预先导入微软 GPG 公钥并写入 VS Code 软件源（确保签名校验通过）
  - type: script
    snippets:
      - |
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
        tee /etc/yum.repos.d/vscode.repo <<'EOF'
        [code]
        name=Visual Studio Code
        baseurl=https://packages.microsoft.com/yumrepos/vscode
        enabled=1
        gpgcheck=1
        gpgkey=https://packages.microsoft.com/keys/microsoft.asc
        EOF

  # 2. 安装宿主底层 RPM 软件包
  - type: rpm-ostree
    install:
      # 原生开发工具
      - code
      # KVM / QEMU / Libvirt 虚拟化套件（已移除废弃的 bridge-utils）
      - qemu-kvm
      - libvirt
      - libvirt-daemon-kvm
      - virt-manager
      - virt-install
      - edk2-ovmf
      # 中文输入法组件
      - fcitx5-rime
      - rime-data
      # 外部文件系统与 Btrfs 维护工具
      - ntfs-3g
      - dosfstools
      - exfatprogs
      - compsize
      # Waydroid 容器与轻量合成器
      - waydroid
      - cage
      - wlr-randr
      # 游戏性能调度
      - gamemode

  # 3. 系统服务状态调优
  - type: systemd
    system:
      enabled:
        - libvirtd.socket            # 虚拟化按需 Socket 监听
        - gamemoded.service
      disabled:
        - libvirtd.service           # 禁用全量守护进程开机常驻
        - waydroid-container.service # 禁用 Waydroid 后台开机常驻

  # 4. 预装 Flatpak 应用
  - type: default-flatpaks
    system:
      install:
        - com.valvesoftware.Steam
        - com.usebottles.bottles
        - com.github.tchx84.Flatseal

  # 5. 镜像安全签名
  - type: signing
