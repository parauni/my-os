# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: my-aurora-custom
description: 个人定制纯净工作站 (VSCode RPM / 按需Libvirt / Rime / Waydroid / Flatpak游戏环境)
base-image: ghcr.io/ublue-os/aurora-nvidia-open
image-version: latest

modules:
  # 1. 预先配置微软官方 VS Code 源与 GPG 密钥
  - type: script
    snippets:
      - |
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
        tee /etc/yum.repos.d/vscode.repo <<'EOF'
        [code]
        name=Visual Studio Code
        baseurl=https://packages.microsoft.com/yumrepos/vscode
        enabled=1
        gpgcheck=1
        gpgkey=https://packages.microsoft.com/keys/microsoft.asc
        EOF

  # 2. 官方标准 dnf 模块声明安装 RPM 包（已移除 Debian 专属包名及基础镜像已内置的包）
  - type: dnf
    install:
      packages:
        # 原生开发工具
        - code
        # KVM / QEMU / Libvirt 虚拟化套件
        - qemu-kvm
        - libvirt
        - libvirt-daemon-kvm
        - virt-manager
        - virt-install
        - edk2-ovmf
        # 中文输入法组件 (自动拉取 Fedora 下所有 Rime 基础依赖)
        - fcitx5-rime
        - librime-plugin-lua # 提供 Lua 脚本引擎支持
        - librime-plugin-octagram # 提供 Octagram 语法/语言模型支持，驱动大模型与语言模型预测。
        # Waydroid 容器与轻量合成器
        - waydroid
        - cage
        - wlr-randr
        # mpv播放器
        - mpv

  # 3. 系统服务状态调优
  - type: systemd
    system:
      enabled:
        - libvirtd.socket            # 虚拟化按需 Socket 监听，启动虚拟机时自动拉起
      disabled:
        - libvirtd.service           # 禁用虚拟化全量服务开机常驻
        - waydroid-container.service # 禁用 Waydroid 容器开机常驻，按需启动

  # 4. 预装沙箱化 Flatpak 应用
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.valvesoftware.Steam     # Steam（沙箱内自带 32 位运行库）
          - com.usebottles.bottles      # Bottles（管理独立老游戏与修改器容器）
          - com.github.tchx84.Flatseal  # Flatpak 权限管理器

  # 5. 镜像安全签名
  - type: signing
